<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mis Hábitos</title>
<meta name="description" content="Registro diario de hábitos con rachas y progreso.">
<meta name="theme-color" content="#0F6B5C">
<meta name="color-scheme" content="light dark">
<meta property="og:type" content="website">
<meta property="og:title" content="Mis Hábitos">
<meta property="og:description" content="Registra tus hábitos cada día, mira tus rachas y tu progreso. Gratis, funciona en el celular y en el computador.">
<meta property="og:image" content="https://torresricardoandres28-debug.github.io/habitos/icon-512.png">
<meta property="og:url" content="https://torresricardoandres28-debug.github.io/habitos/">
<meta property="og:locale" content="es_LA">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Hábitos">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600&display=swap">
<style>

/* Layout: una sola columna centrada (máx 640px). Barra superior con fecha y avance del día,
   pestañas Hoy / Progreso, filas de hábitos con check grande y tira de 7 días. */
:root {
  --bg: #EDF0EA;
  --surface: #FAFBF8;
  --surface-2: #E2E7DF;
  --ink: #17261F;
  --ink-2: #566860;
  --line: #CFD7CC;
  --accent: #0F6B5C;
  --accent-ink: #FFFFFF;
  --good: #2E7D32;
  --warn: #B26A00;
  --h1: #0F8B7A; --h2: #D98E04; --h3: #D8553F; --h4: #4F5BD5; --h5: #A24A93; --h6: #6E8B2F;
  --display: "Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F1815; --surface: #17231F; --surface-2: #21302A; --ink: #E6EEE8; --ink-2: #9DB0A6;
    --line: #2C3D36; --accent: #4FC3AC; --accent-ink: #08201A; --good: #6CC070; --warn: #E3A23A;
    --h1: #3FC2AE; --h2: #F0AE2E; --h3: #F2806B; --h4: #8E98FF; --h5: #D88BCB; --h6: #A5C75A;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F1815; --surface: #17231F; --surface-2: #21302A; --ink: #E6EEE8; --ink-2: #9DB0A6;
  --line: #2C3D36; --accent: #4FC3AC; --accent-ink: #08201A; --good: #6CC070; --warn: #E3A23A;
  --h1: #3FC2AE; --h2: #F0AE2E; --h3: #F2806B; --h4: #8E98FF; --h5: #D88BCB; --h6: #A5C75A;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.45;
  padding-block: 20px 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.app { max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
.top { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
.top h1 { font-family: var(--display); font-size: 1.9rem; line-height: 1.05; margin: 0; letter-spacing: -0.02em; text-wrap: balance; }
.top .sub { color: var(--ink-2); font-size: 0.9rem; margin-top: 4px; }
.top .sub::first-letter, .daynav .lbl::first-letter { text-transform: uppercase; }
.ring-wrap { display: flex; align-items: center; gap: 10px; }
.ring-wrap .num { font-family: var(--display); font-weight: 700; font-size: 1.15rem; font-variant-numeric: tabular-nums; text-align: right; line-height: 1.1; }
.ring-wrap .num small { display: block; font-family: var(--body); font-weight: 500; font-size: 0.75rem; color: var(--ink-2); }
.ring { width: 52px; height: 52px; }
.ring circle { fill: none; stroke-width: 6; }
.ring .track { stroke: var(--surface-2); }
.ring .bar { stroke: var(--accent); stroke-linecap: round; transform: rotate(-90deg); transform-origin: 50% 50%; transition: stroke-dashoffset .4s ease; }
.tabs { display: flex; gap: 6px; background: var(--surface-2); padding: 4px; border-radius: 12px; }
.tabs button { flex: 1; border: 0; background: transparent; padding: 9px 10px; border-radius: 9px; font-weight: 600; color: var(--ink-2); }
.tabs button[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
.daynav { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.daynav .lbl { font-weight: 600; text-align: center; flex: 1; }
.icon-btn { width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; font-size: 1.1rem; }
.icon-btn:disabled { opacity: .35; cursor: default; }
.chip-btn { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 12px; font-size: 0.85rem; font-weight: 600; }
.list { display: flex; flex-direction: column; gap: 10px; }
.habit { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px; display: grid; grid-template-columns: auto minmax(0,1fr) auto; gap: 4px 14px; align-items: center; }
.check { width: 48px; height: 48px; border-radius: 50%; border: 2.5px solid var(--c); background: transparent; display: grid; place-items: center; grid-row: span 2; transition: background .15s, transform .1s; }
.check svg { width: 24px; height: 24px; stroke: var(--surface); stroke-width: 3.2; fill: none; stroke-linecap: round; stroke-linejoin: round; opacity: 0; }
.check[aria-pressed="true"] { background: var(--c); }
.check[aria-pressed="true"] svg { opacity: 1; }
.check:active { transform: scale(.92); }
.habit .name { font-weight: 600; font-size: 1.05rem; min-width: 0; overflow-wrap: anywhere; }
.habit .meta { color: var(--ink-2); font-size: 0.82rem; display: flex; gap: 10px; flex-wrap: wrap; font-variant-numeric: tabular-nums; }
.streak { font-weight: 600; color: var(--c); }
.edit { border: 0; background: transparent; color: var(--ink-2); width: 36px; height: 36px; border-radius: 8px; grid-row: span 2; font-size: 1.2rem; letter-spacing: 1px; }
.strip { grid-column: 2 / 4; display: flex; gap: 6px; margin-top: 4px; }
.strip button { width: 26px; height: 26px; border-radius: 7px; border: 1.5px solid var(--line); background: transparent; font-size: 0.65rem; font-weight: 600; color: var(--ink-2); padding: 0; }
.strip button[aria-pressed="true"] { background: var(--c); border-color: var(--c); color: var(--surface); }
.strip button:disabled { opacity: .35; cursor: default; }
.strip button.sel { outline: 2px solid var(--ink-2); outline-offset: 1px; }
.add { display: block; width: 100%; margin-top: 10px; border: 1.5px dashed var(--line); background: transparent; border-radius: 16px; padding: 14px; font-weight: 600; color: var(--ink-2); }
.add:hover { border-color: var(--accent); color: var(--accent); }
.empty { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
.empty h2 { font-family: var(--display); font-size: 1.3rem; margin: 0; }
.empty p { margin: 0; color: var(--ink-2); max-width: 55ch; }
.sugg { display: flex; flex-wrap: wrap; gap: 8px; }
.banner { background: color-mix(in srgb, var(--warn) 14%, var(--surface)); border: 1px solid color-mix(in srgb, var(--warn) 40%, var(--line)); border-radius: 12px; padding: 10px 12px; font-size: 0.85rem; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 12px; }
.panel h2 { font-family: var(--display); font-size: 1.05rem; margin: 0; }
.bars { display: grid; grid-template-columns: repeat(14, minmax(0,1fr)); gap: 5px; align-items: end; height: 96px; }
.bars .col { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 4px; height: 100%; }
.bars .b { width: 100%; background: var(--accent); border-radius: 4px 4px 2px 2px; min-height: 3px; opacity: .9; }
.bars .b.zero { background: var(--surface-2); }
.bars span { font-size: 0.65rem; color: var(--ink-2); }
.stats { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 8px; }
.stat { background: var(--surface-2); border-radius: 10px; padding: 8px 10px; }
.stat b { display: block; font-family: var(--display); font-size: 1.3rem; font-variant-numeric: tabular-nums; line-height: 1.1; }
.stat small { color: var(--ink-2); font-size: 0.72rem; }
.phead { display: flex; align-items: center; gap: 10px; }
.dot { width: 12px; height: 12px; border-radius: 50%; background: var(--c); flex: none; }
.phead h3 { margin: 0; font-size: 1.05rem; min-width: 0; overflow-wrap: anywhere; flex: 1; }
.phead .wk { font-size: 0.82rem; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.heat-scroll { overflow-x: auto; padding-bottom: 4px; }
.heat { display: grid; grid-template-rows: repeat(7, 13px); grid-auto-flow: column; grid-auto-columns: 13px; gap: 3px; width: max-content; }
.heat i { border-radius: 3px; background: var(--surface-2); }
.heat i.on { background: var(--c); }
.heat i.fut { background: transparent; }
.heat-legend { font-size: 0.72rem; color: var(--ink-2); }
.overlay { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: flex; align-items: flex-end; justify-content: center; z-index: 10;
  padding: 0 max(0px, env(safe-area-inset-left, 0px)) env(safe-area-inset-bottom, 0px) max(0px, env(safe-area-inset-right, 0px)); }
.sheet { background: var(--surface); width: min(520px, 100%); border-radius: 20px 20px 0 0; padding: 20px 16px 24px; display: flex; flex-direction: column; gap: 14px; max-height: 92%; overflow-y: auto; }
@media (min-width: 600px) { .overlay { align-items: center; } .sheet { border-radius: 20px; } }
.sheet h2 { margin: 0; font-family: var(--display); font-size: 1.3rem; }
label.f { display: flex; flex-direction: column; gap: 6px; font-size: 0.85rem; font-weight: 600; color: var(--ink-2); }
input[type=text], select { font: inherit; font-size: 1rem; padding: 11px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); width: 100%; }
.swatches { display: flex; gap: 10px; flex-wrap: wrap; }
.swatches button { width: 34px; height: 34px; border-radius: 50%; border: 3px solid transparent; background: var(--c); padding: 0; }
.swatches button[aria-pressed="true"] { border-color: var(--ink); }
.row { display: flex; gap: 10px; flex-wrap: wrap; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 11px 16px; font-weight: 600; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); flex: 1; }
.btn.danger { color: #C0392B; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 9px 14px; border-radius: 10px; font-size: 0.85rem; z-index: 20; }
@media (max-width: 420px) { .stats { grid-template-columns: repeat(2, minmax(0,1fr)); } .top h1 { font-size: 1.6rem; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

.backup { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-top: 8px; }
html, body { min-height: 100%; }


.group-h { font-family: var(--display); font-size: 0.8rem; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-2); margin: 8px 2px 0; }
.list + .group-h { margin-top: 14px; }
.mini { border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 1px 9px; font-size: 0.75rem; font-weight: 600; color: var(--ink-2); }
.check.count span { font-size: 0.8rem; font-weight: 700; color: var(--c); font-variant-numeric: tabular-nums; }
.check.count[aria-pressed="true"] span { color: var(--surface); }
.strip button.off { opacity: .45; border-style: dashed; }
.rest { color: var(--ink-2); font-size: 0.85rem; margin: 4px 2px 0; }
.muted { color: var(--ink-2); margin: 0; font-size: 0.9rem; }
.row.between { justify-content: space-between; align-items: center; flex-wrap: nowrap; }
.row .grow, .grow { flex: 1; min-width: 0; }
.stats.two { grid-template-columns: repeat(2, minmax(0,1fr)); }
.insights, .notes { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 6px; font-size: 0.9rem; }
.notes { color: var(--ink-2); }
.notes b { color: var(--ink); }
textarea, input[type=number] { font: inherit; font-size: 1rem; padding: 11px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); width: 100%; }
textarea { resize: vertical; }
.dows { display: flex; gap: 6px; flex-wrap: wrap; }
.dows button { width: 40px; height: 40px; border-radius: 50%; border: 1.5px solid var(--line); background: transparent; font-weight: 600; color: var(--ink-2); padding: 0; }
.dows button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.arch-row { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); }
.msg { margin: 0; color: var(--warn); font-size: 0.9rem; }
.chip-btn.danger { color: #C0392B; }
.toast { display: flex; gap: 12px; align-items: center; }
.toast-btn { background: transparent; border: 0; color: inherit; font-weight: 700; text-decoration: underline; padding: 0; }

body { padding-bottom: calc(150px + env(safe-area-inset-bottom, 0px)) !important; }
#view { display: flex; flex-direction: column; gap: 14px; }
.list { gap: 12px; }
.bottom { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; background: var(--surface); border-top: 1px solid var(--line);
  padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px)); }
.bottom .in { display: flex; gap: 4px; max-width: 640px; margin: 0 auto; }
.bottom button { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; border: 0; background: transparent; min-height: 54px; border-radius: 12px; color: var(--ink-2); font-size: 0.8rem; font-weight: 600; padding: 6px 4px; }
.bottom button[aria-current="page"] { color: var(--accent); background: color-mix(in srgb, var(--accent) 10%, transparent); }
.bottom svg { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.fab { position: fixed; z-index: 6; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(78px + env(safe-area-inset-bottom, 0px)); width: 58px; height: 58px; border-radius: 50%; border: 0; background: var(--accent); color: var(--accent-ink); font-size: 2rem; line-height: 1; box-shadow: 0 4px 14px rgba(0,0,0,.28); }
.toast { bottom: calc(86px + env(safe-area-inset-bottom, 0px)) !important; }
.icon-btn { width: 44px; height: 44px; }
.edit { width: 44px; height: 44px; }
.strip { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; margin-top: 8px; }
.strip button { width: 100%; height: 44px; border-radius: 10px; font-size: 0.85rem; }
.habit { padding: 14px; }
.mini { position: relative; padding: 3px 11px; font-size: 0.8rem; }
.mini::after { content: ""; position: absolute; inset: -11px -5px; }
.chip-btn { min-height: 40px; padding: 8px 14px; font-size: 0.9rem; }
.streak { color: var(--ink) !important; }
.streak::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--c); margin-right: 6px; }
.ring-wrap .num small { font-size: 0.8rem; }
.heat-legend, .stat small { font-size: 0.8rem; }
.banner { display: flex; flex-direction: column; gap: 8px; align-items: flex-start; background: color-mix(in srgb, var(--accent) 10%, var(--surface)); border: 1px solid color-mix(in srgb, var(--accent) 35%, var(--line)); border-radius: 14px; padding: 12px 14px; font-size: 0.95rem; }
.banner p { margin: 0; }
.menu { display: flex; flex-direction: column; }
.menu-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; text-align: left; border: 0; border-bottom: 1px solid var(--line); background: transparent; padding: 14px 4px; min-height: 52px; font-weight: 600; }
.menu-row small { color: var(--ink-2); font-weight: 500; font-size: 0.85rem; }
.hint { color: var(--ink-2); font-size: 0.85rem; margin: -6px 0 0; }
.link-btn { border: 0; background: transparent; color: var(--accent); font-weight: 600; text-decoration: underline; padding: 10px 0; text-align: left; }
@media (prefers-reduced-motion: no-preference) { .check:active { transform: scale(.9); } .check[aria-pressed="true"] { animation: pop .25s ease; } @keyframes pop { 50% { transform: scale(1.12); } } }
html { padding: env(safe-area-inset-top, 0px) 0 0; }
body { margin: 0; }
</style>
</head>
<body>
<div class="app" id="app">
  <div class="top">
    <div>
      <h1>Mis Hábitos</h1>
      <div class="sub" id="sub"></div>
    </div>
    <div class="ring-wrap" aria-live="polite">
      <div class="num" id="ringnum"></div>
      <svg class="ring" viewBox="0 0 52 52" aria-hidden="true">
        <circle class="track" cx="26" cy="26" r="22"></circle>
        <circle class="bar" id="ringbar" cx="26" cy="26" r="22" stroke-dasharray="138.2" stroke-dashoffset="138.2"></circle>
      </svg>
    </div>
  </div>
  <div id="view"></div>
  <input type="file" id="importfile" accept="application/json,.json" hidden>
</div>
<button class="fab" id="fab" data-act="new" aria-label="Nuevo hábito" hidden>+</button>
<nav class="bottom" aria-label="Navegación principal"><div class="in">
  <button id="tab-hoy" data-tab="hoy" aria-current="page"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l3 3 5-6"/></svg>Hoy</button>
  <button id="tab-prog" data-tab="prog"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20V11M12 20V4M19 20v-6"/></svg>Progreso</button>
  <button id="morebtn" data-act="more"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="19" cy="12" r="1.2"/></svg>Más</button>
</div></nav>
<div id="modal"></div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.1/dist/umd/supabase.js"></script>
<script defer src="config.js"></script>
<script defer src="app.js"></script>
</body>
</html>
